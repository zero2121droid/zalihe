# Production: the app, its database and Caddy (HTTPS). Settings and passwords come from deploy/.env
# (copy .env.example). Runs the same way locally for a full check before the server; see docs/DEPLOY.md.
#
#   docker compose -f deploy/docker-compose.yml up -d --build --wait

name: zalihe-prod

services:
  app:
    build:
      context: ..
    image: zalihe-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Database=zalihe;Username=zalihe;Password=${POSTGRES_PASSWORD:?}
      Database__MigrateOnStartup: "true"
      ForwardedHeaders__Enabled: "true"
      # Without these keys the shops' stored API keys can't be read: the volume is backed up with the database.
      DataProtection__KeysPath: /data/keys
      Webhooks__BaseUrl: ${APP_URL:?}
      Email__AppUrl: ${APP_URL:?}
      Email__Host: ${SMTP_HOST:?}
      Email__Port: ${SMTP_PORT:-587}
      Email__Security: ${SMTP_SECURITY:-StartTls}
      Email__UserName: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__From: ${EMAIL_FROM:?}
    volumes:
      - keys:/data/keys
    # Not published: only Caddy reaches the app, which is why it may trust the X-Forwarded-* headers.
    expose:
      - "8080"
    healthcheck:
      # The image has no curl; bash can open a TCP connection itself.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: zalihe
      POSTGRES_USER: zalihe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zalihe -d zalihe"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates; losing them only means Caddy asks for new ones.
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  postgres-data:
  keys:
  caddy-data:
  caddy-config:
