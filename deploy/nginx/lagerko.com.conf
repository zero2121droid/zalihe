# The landing page: Nginx serves landing/ directly, the app isn't involved. Copied to
# /etc/nginx/conf.d/ once, then certbot adds HTTPS to both blocks (see docs/DEPLOY.md).

server {
    listen 80;
    listen [::]:80;
    server_name www.lagerko.com;

    return 301 https://lagerko.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name lagerko.com;

    root /srv/lagerko/landing;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # The folder also holds notes for working on the page.
    location ~ ^/(CLAUDE\.md|\.) {
        return 404;
    }

    location /assets/ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
