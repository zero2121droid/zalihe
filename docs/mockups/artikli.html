<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<title>Zalihe — Artikli</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#11130E}
a{color:#B4C17E}a:hover{color:#CBD69A}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr)}
@media (max-width:820px){.shell{grid-template-columns:1fr}.side{display:none!important}}
</style>
</helmet>
<div class="shell" style="min-height: 900px; background: #11130E; color: #E4E7DC; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.45">

<aside class="side" style="display: flex; flex-direction: column; gap: 28px; padding: 24px 16px; border-right: 1px solid #2C3125; background: #141710">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<div style="width: 14px; height: 14px; background: #B4C17E"></div>
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 17px; font-weight: 600; letter-spacing: -0.02em">zalihe</span>
</div>
<nav aria-label="Glavna navigacija" style="display: flex; flex-direction: column; gap: 2px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; color: #9BA18F; text-decoration: none; border-radius: 4px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Početna</a>
<a href="Artikli.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; color: #E4E7DC; background: #20241B; text-decoration: none; border-radius: 4px; font-weight: 500">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4C17E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4-9-4z"></path><path d="M3 7v10l9 4 9-4V7"></path></svg>Artikli</a>
<a href="#" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; color: #9BA18F; text-decoration: none; border-radius: 4px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16"></path><path d="M3 8l4-4 4 4"></path><path d="M17 20V4"></path><path d="M21 16l-4 4-4-4"></path></svg>Kretanja</a>
<a href="#" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; color: #9BA18F; text-decoration: none; border-radius: 4px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 10l5 5 5-5"></path><path d="M4 20h16"></path></svg>Prijem robe</a>
<a href="#" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; color: #9BA18F; text-decoration: none; border-radius: 4px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>Kanali prodaje</a>
<a href="#" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; color: #9BA18F; text-decoration: none; border-radius: 4px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg>Izveštaji</a>
</nav>
<div style="margin-top: auto; padding: 12px 10px; border-top: 1px solid #2C3125; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 500">Pržionica Zrno</span>
<span style="color: #9BA18F; font-size: 12px">Miljan · vlasnik</span>
</div>
</aside>

<main style="display: flex; flex-direction: column; gap: 20px; padding: 28px 36px 40px; max-width: 1180px; box-sizing: border-box; width: 100%">

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<div style="display: flex; align-items: baseline; gap: 12px">
<h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em">Artikli</h1>
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: #9BA18F">312</span>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button type="button" style="height: 40px; padding: 0 16px; background: transparent; color: #E4E7DC; border: 1px solid #3A4030; border-radius: 4px; font: inherit; font-weight: 500; cursor: pointer">Uvezi CSV</button>
<button type="button" style="height: 40px; padding: 0 16px; background: {{accent}}; color: #11130E; border: 0; border-radius: 4px; font: inherit; font-weight: 600; cursor: pointer">Novi artikal</button>
</div>
</div>

<div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap">
<label style="flex: 1 1 320px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 1px solid #2C3125; border-radius: 4px; background: #191C15">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9BA18F" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Pretraga artikala</span>
<input type="search" placeholder="Naziv, šifra ili barkod" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #E4E7DC; font: inherit">
</label>
<div role="group" aria-label="Filter po stanju" style="display: flex; gap: 6px; flex-wrap: wrap">
<button type="button" aria-pressed="true" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #B4C17E; background: #252B1C; color: #E4E7DC; font: inherit; font-size: 13px; cursor: pointer">Svi</button>
<button type="button" aria-pressed="false" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #2C3125; background: transparent; color: #C4C9B8; font: inherit; font-size: 13px; cursor: pointer">Ispod minimuma <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #E0A84A">7</span></button>
<button type="button" aria-pressed="false" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #2C3125; background: transparent; color: #C4C9B8; font: inherit; font-size: 13px; cursor: pointer">Nema na stanju <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #E8806A">3</span></button>
<button type="button" aria-pressed="false" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #2C3125; background: transparent; color: #C4C9B8; font: inherit; font-size: 13px; cursor: pointer">Bez prometa 60+ dana</button>
</div>
</div>

<section style="border: 1px solid #2C3125; border-radius: 6px; background: #191C15; overflow-x: auto">
<div style="min-width: 860px">
<div style="display: grid; grid-template-columns: minmax(0, 2.4fr) 1.2fr 110px 70px 140px 90px 120px; gap: 16px; padding: 11px 20px; border-bottom: 1px solid #2C3125; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #9BA18F">
<span>Artikal</span><span>Šifra</span><span style="text-align: right">Stanje</span><span style="text-align: right">Min.</span><span>Status</span><span style="text-align: right">Prodaja 30d</span><span style="text-align: right">Vrednost</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div style="display: grid; grid-template-columns: minmax(0, 2.4fr) 1.2fr 110px 70px 140px 90px 120px; gap: 16px; align-items: center; padding: 12px 20px; border-bottom: 1px solid #23271E">
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<span style="font-size: 12px; color: #9BA18F">{{r.cat}}</span>
</div>
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #C4C9B8">{{r.sku}}</span>
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 18px; font-weight: 500; text-align: right; color: {{r.qtyColor}}; font-variant-numeric: tabular-nums">{{r.qty}} <span style="font-size: 11px; color: #9BA18F">{{r.unit}}</span></span>
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; text-align: right; color: #9BA18F; font-variant-numeric: tabular-nums">{{r.min}}</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{r.statusColor}}"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{r.statusColor}}"></span>{{r.status}}</span>
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; text-align: right; font-variant-numeric: tabular-nums">{{r.sold}}</span>
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; text-align: right; color: #C4C9B8; font-variant-numeric: tabular-nums">{{r.value}}</span>
</div>
</sc-for>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; font-size: 13px; color: #9BA18F">
<span>1–10 od 312</span>
<div style="display: flex; gap: 6px">
<button type="button" aria-label="Prethodna strana" style="width: 32px; height: 32px; border: 1px solid #2C3125; border-radius: 4px; background: transparent; color: #9BA18F; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" aria-label="Sledeća strana" style="width: 32px; height: 32px; border: 1px solid #2C3125; border-radius: 4px; background: transparent; color: #E4E7DC; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>
</div>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4C17E","options":["#B4C17E","#9DB06A","#C9B77A","#8FB0A0"]},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = { status: 'Na stanju', statusColor: '#9DB06A', qtyColor: '#E4E7DC' };
    const low = { status: 'Ispod minimuma', statusColor: '#E0A84A', qtyColor: '#E0A84A' };
    const out = { status: 'Nema na stanju', statusColor: '#E8806A', qtyColor: '#E8806A' };
    const rows = [
      { name: 'Kafa Etiopija Yirgacheffe 250 g', cat: 'Kafa · zrno', sku: 'KF-ETI-250', qty: '4', unit: 'kom', min: '10', sold: '38', value: '3.600', ...low },
      { name: 'Kafa Kolumbija Huila 250 g', cat: 'Kafa · zrno', sku: 'KF-KOL-250', qty: '31', unit: 'kom', min: '10', sold: '29', value: '24.800', ...ok },
      { name: 'Kafa Brazil Santos 1 kg', cat: 'Kafa · zrno', sku: 'KF-BRA-1000', qty: '0', unit: 'kom', min: '5', sold: '12', value: '0', ...out },
      { name: 'Ručni mlin za kafu', cat: 'Oprema', sku: 'ML-RUC-01', qty: '6', unit: 'kom', min: '2', sold: '4', value: '42.000', ...ok },
      { name: 'Džezva bakarna 300 ml', cat: 'Oprema', sku: 'DZ-BAK-300', qty: '0', unit: 'kom', min: '3', sold: '7', value: '0', ...out },
      { name: 'Šolja keramička 250 ml, siva', cat: 'Posuđe', sku: 'SO-KER-250-SI', qty: '2', unit: 'kom', min: '8', sold: '15', value: '1.300', ...low },
      { name: 'Šolja keramička 250 ml, bela', cat: 'Posuđe', sku: 'SO-KER-250-BE', qty: '19', unit: 'kom', min: '8', sold: '11', value: '12.350', ...ok },
      { name: 'Filter papir V60, 100 kom', cat: 'Potrošni', sku: 'FP-V60-100', qty: '6', unit: 'pak', min: '15', sold: '41', value: '2.040', ...low },
      { name: 'Espresso mešavina, rinfuz', cat: 'Kafa · zrno', sku: 'KF-ESP-1000', qty: '12,5', unit: 'kg', min: '5', sold: '9', value: '25.000', ...ok },
      { name: 'Čajnik stakleni 600 ml', cat: 'Posuđe', sku: 'CA-STA-600', qty: '0', unit: 'kom', min: '2', sold: '3', value: '0', ...out }
    ];
    return { accent: this.props.accent ?? '#B4C17E', rows };
  }
}
</script>
</body>
</html>
