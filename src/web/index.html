<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Same key as src/colorScheme.ts: applies the saved theme before the app loads, so it never flashes.
      try {
        var scheme = localStorage.getItem('zalihe.colorScheme')
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme === 'light' ? 'light' : 'dark')
      } catch (e) {
        document.documentElement.setAttribute('data-mantine-color-scheme', 'dark')
      }
    </script>
    <title>Zalihe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
